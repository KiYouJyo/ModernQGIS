name: Build signed functional preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-preview.yml"
      - "installer/**"
      - "release/**"
      - "src/**"
      - "tests/**"
      - "translations/**"
      - "cmake/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "README*"
      - "LICENSE"
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - ".github/workflows/release-preview.yml"
      - "installer/**"
      - "release/**"
      - "src/**"
      - "tests/**"
      - "translations/**"
      - "cmake/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "README*"
      - "LICENSE"

permissions:
  contents: write

jobs:
  package-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}

      - name: Validate contracts
        run: |
          python scripts/check_i18n.py
          python scripts/check_release_contract.py

      - name: Read target version
        id: version
        shell: pwsh
        run: |
          $m = Get-Content release/release.json -Raw | ConvertFrom-Json
          "version=$($m.version)" >> $env:GITHUB_OUTPUT
          "publish=$($m.channels.github.publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") { throw "Tag/version mismatch" }
          if ("${{ steps.version.outputs.publish }}" -ne "true") { throw "Tagged publication requires publish=true" }

      - name: Install OSGeo4W QGIS development SDK and Qt 6
        id: osgeo
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\OSGeo4W"
          $site = "https://download.osgeo.org/osgeo4w/v2/"
          $setupExe = Join-Path $env:RUNNER_TEMP "osgeo4w-setup.exe"
          $setupIni = Join-Path $env:RUNNER_TEMP "osgeo4w-setup.ini"
          Invoke-WebRequest -Uri ($site + "osgeo4w-setup.exe") -OutFile $setupExe
          Invoke-WebRequest -Uri ($site + "x86_64/setup.ini") -OutFile $setupIni
          $catalog = Get-Content $setupIni -Raw

          function Has-Package([string]$name) {
            return $catalog -match ("(?m)^@\s+" + [regex]::Escape($name) + "\s*$")
          }

          if (Has-Package "qgis-devel") {
            $qgisPackage = "qgis-devel"
            $qgisSubdir = "qgis"
          } elseif (Has-Package "qgis-qt6-devel") {
            $qgisPackage = "qgis-qt6-devel"
            $qgisSubdir = "qgis-qt6"
          } else {
            throw "No supported QGIS development package was found in the current OSGeo4W catalog."
          }

          $packages = "$qgisPackage,qt6-devel,qt6-libs,qt6-tools"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Start-Process $setupExe -ArgumentList @(
            '--advanced', '--autoaccept', '--quiet-mode', '--only-site',
            '-R', $root,
            '-s', $site,
            '-P', $packages
          ) -Wait -NoNewWindow

          $qgisPrefix = Join-Path $root "apps\$qgisSubdir"
          $qtPrefix = Join-Path $root "apps\qt6"
          if (-not (Test-Path (Join-Path $qgisPrefix "include\qgis.h"))) { throw "QGIS public headers were not installed at $qgisPrefix" }
          if (-not (Test-Path (Join-Path $qtPrefix "lib\cmake\Qt6\Qt6Config.cmake"))) { throw "Qt6 CMake package was not installed at $qtPrefix" }

          Add-Content $env:GITHUB_PATH (Join-Path $root "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $qtPrefix "bin")
          "root=$root" >> $env:GITHUB_OUTPUT
          "qgis-prefix=$qgisPrefix" >> $env:GITHUB_OUTPUT
          "qt-prefix=$qtPrefix" >> $env:GITHUB_OUTPUT
          "qgis-package=$qgisPackage" >> $env:GITHUB_OUTPUT

      - name: Configure functional QGIS build
        shell: pwsh
        run: |
          $prefixes = "${{ steps.osgeo.outputs.qt-prefix }};${{ steps.osgeo.outputs.root }}"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DMODERNQGIS_WITH_QGIS=ON `
            -DMODERNQGIS_BUILD_TESTS=ON `
            -DMODERNQGIS_BUILD_SANDBOX=ON `
            -DQGIS_PREFIX_PATH="${{ steps.osgeo.outputs.qgis-prefix }}" `
            -DCMAKE_PREFIX_PATH="$prefixes" `
            -DQt6_DIR="${{ steps.osgeo.outputs.qt-prefix }}\lib\cmake\Qt6"

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure

      - name: Stage functional runtime
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.version.outputs.version }}"
          $stage = "dist/ModernQGIS-v$v-windows-x64"
          $plugins = "$stage/plugins"
          $docs = "$stage/docs"
          New-Item -ItemType Directory -Force -Path $stage, $plugins, $docs | Out-Null

          $launcher = Get-ChildItem build -Filter modernqgis-launcher.exe -Recurse | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $plugin = Get-ChildItem build -Filter modernqgis.dll -Recurse | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $launcher) { throw "modernqgis-launcher.exe was not produced." }
          if (-not $plugin) { throw "modernqgis.dll QGIS plugin was not produced." }

          Copy-Item $launcher.FullName "$stage/modernqgis-launcher.exe"
          Copy-Item $plugin.FullName "$plugins/modernqgis.dll"

          $windeployqt = "${{ steps.osgeo.outputs.qt-prefix }}\bin\windeployqt.exe"
          if (-not (Test-Path $windeployqt)) { throw "windeployqt.exe was not found." }
          & $windeployqt --release --no-translations "$stage/modernqgis-launcher.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for ModernQGIS Launcher." }

          Copy-Item "LICENSE" $stage
          Copy-Item "README.md", "README.ja.md", "README.en.md" $docs
          Copy-Item "release/notes/v$v.zh-CN.md", "release/notes/v$v.ja-JP.md", "release/notes/v$v.en-US.md" $docs
          @(
            "ModernQGIS v$v Functional Preview",
            "Requires an installed QGIS 4.x runtime (validated against QGIS 4.2 public SDK).",
            "The launcher adds this package's plugins directory to QGIS_PLUGINPATH and starts QGIS.",
            "If QGIS has not enabled the ModernQGIS C++ plugin previously, enable ModernQGIS once from the QGIS Plugin Manager."
          ) | Set-Content -Encoding UTF8 "$stage/INSTALLATION.txt"
          "stage=$stage" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare code-signing identity
        id: signing
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 || secrets.WINDOWS_CERTIFICATE_BASE64 || secrets.CERTIFICATE_BASE64 || secrets.PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD || secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.CERTIFICATE_PASSWORD || secrets.PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $cerPath = Join-Path (Resolve-Path dist) "ModernQGIS-SigningCertificate.cer"
          $source = "repository-secret"
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "modernqgis-signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
            $plainPassword = if ($null -eq $env:PFX_PASSWORD) { "" } else { $env:PFX_PASSWORD }
            $secure = ConvertTo-SecureString $plainPassword -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secure
            $cert = $imported | Where-Object { $_.HasPrivateKey } | Select-Object -First 1
            if (-not $cert) { throw "The configured PFX did not import a certificate with a private key." }
          } else {
            $source = "self-signed-fallback"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AppPublisher" -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          }
          Export-Certificate -Cert $cert -FilePath $cerPath -Force | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPublisher" | Out-Null
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "source=$source" >> $env:GITHUB_OUTPUT
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT

      - name: Locate SignTool
        id: signtool
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { throw "signtool.exe was not found on the Windows runner." }
          "path=$tool" >> $env:GITHUB_OUTPUT

      - name: Sign ModernQGIS binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            (Join-Path "${{ steps.stage.outputs.stage }}" "modernqgis-launcher.exe"),
            (Join-Path "${{ steps.stage.outputs.stage }}" "plugins\modernqgis.dll")
          )
          foreach ($file in $files) {
            & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /sha1 "${{ steps.signing.outputs.thumbprint }}" /tr http://timestamp.digicert.com /td SHA256 $file
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Timestamp service failed for $file; retrying without timestamp."
              & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /sha1 "${{ steps.signing.outputs.thumbprint }}" $file
            }
            if ($LASTEXITCODE -ne 0) { throw "Binary signing failed: $file" }
          }

      - name: Build portable archive and installer
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.version.outputs.version }}"
          $stage = (Resolve-Path "${{ steps.stage.outputs.stage }}").Path
          $dist = (Resolve-Path dist).Path
          $zip = Join-Path $dist "ModernQGIS-v$v-windows-x64.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found." }
          & $iscc "/DMyAppVersion=$v" "/DStageDir=$stage" "/DOutputDir=$dist" "installer/ModernQGIS.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = Join-Path $dist "ModernQGIS-v$v-windows-x64-setup.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer was not generated: $installer" }
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Sign installer
        shell: pwsh
        run: |
          $installer = "${{ steps.package.outputs.installer }}"
          & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /sha1 "${{ steps.signing.outputs.thumbprint }}" /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Timestamp service failed; retrying without timestamp."
            & "${{ steps.signtool.outputs.path }}" sign /fd SHA256 /sha1 "${{ steps.signing.outputs.thumbprint }}" $installer
          }
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }

      - name: Verify signatures and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path "${{ steps.stage.outputs.stage }}" "modernqgis-launcher.exe"
          $plugin = Join-Path "${{ steps.stage.outputs.stage }}" "plugins\modernqgis.dll"
          $installer = "${{ steps.package.outputs.installer }}"
          $expected = "${{ steps.signing.outputs.thumbprint }}"
          $source = "${{ steps.signing.outputs.source }}"

          function Assert-Signature([string]$name, [string]$file) {
            $sig = Get-AuthenticodeSignature $file
            if (-not $sig.SignerCertificate) { throw "$name has no Authenticode signer certificate." }
            if ($sig.SignerCertificate.Thumbprint -ne $expected) { throw "$name signer thumbprint mismatch." }
            $bad = @("NotSigned", "HashMismatch", "NotSupportedFormat", "Incompatible")
            if ($bad -contains $sig.Status.ToString()) { throw "$name Authenticode validation failed: $($sig.Status)." }
            if ($source -eq "repository-secret" -and $sig.Status -ne "Valid") { throw "$name repository certificate is not trusted/valid: $($sig.Status)." }
            if ($source -eq "repository-secret") {
              & "${{ steps.signtool.outputs.path }}" verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "$name public-trust verification failed." }
            }
            return $sig.Status.ToString()
          }

          $launcherStatus = Assert-Signature "Launcher" $launcher
          $pluginStatus = Assert-Signature "QGIS plugin" $plugin
          $installerStatus = Assert-Signature "Installer" $installer
          $trustMode = if ($source -eq "repository-secret") { "trusted-chain-required" } else { "self-signed-certificate-included" }
          @(
            "version=${{ steps.version.outputs.version }}",
            "package_kind=FunctionalPreview",
            "qgis_bundled=false",
            "qgis_sdk_package=${{ steps.osgeo.outputs.qgis-package }}",
            "source=$source",
            "trust_mode=$trustMode",
            "subject=${{ steps.signing.outputs.subject }}",
            "thumbprint=$expected",
            "launcher_status=$launcherStatus",
            "plugin_status=$pluginStatus",
            "installer_status=$installerStatus"
          ) | Set-Content -Encoding UTF8 dist/SIGNING-INFO.txt

          $files = @(
            "${{ steps.package.outputs.installer }}",
            "${{ steps.package.outputs.zip }}",
            (Resolve-Path "dist/ModernQGIS-SigningCertificate.cer").Path,
            (Resolve-Path "dist/SIGNING-INFO.txt").Path
          )
          $sumLines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sumLines | Set-Content -Encoding ASCII dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ModernQGIS-v${{ steps.version.outputs.version }}-windows-x64-signed
          path: |
            dist/ModernQGIS-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/ModernQGIS-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/ModernQGIS-SigningCertificate.cer
            dist/SIGNING-INFO.txt
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish tagged GitHub Release only
        if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: release/notes/v${{ steps.version.outputs.version }}.en-US.md
          files: |
            dist/ModernQGIS-v${{ steps.version.outputs.version }}-windows-x64-setup.exe
            dist/ModernQGIS-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/ModernQGIS-SigningCertificate.cer
            dist/SIGNING-INFO.txt
            dist/SHA256SUMS
