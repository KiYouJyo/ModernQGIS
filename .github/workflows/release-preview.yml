name: Build preview package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Validate contracts
        run: |
          python scripts/check_i18n.py
          python scripts/check_release_contract.py
      - name: Read target version
        id: version
        shell: pwsh
        run: |
          $m = Get-Content release/release.json -Raw | ConvertFrom-Json
          "version=$($m.version)" >> $env:GITHUB_OUTPUT
          "publish=$($m.channels.github.publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") { throw "Tag/version mismatch" }
          if ("${{ steps.version.outputs.publish }}" -ne "true") { throw "Tagged publication requires publish=true" }
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - run: cmake -S . -B build -DMODERNQGIS_WITH_QGIS=OFF -DMODERNQGIS_BUILD_TESTS=ON -DMODERNQGIS_BUILD_SANDBOX=ON
      - shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Stage runtime
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $stage = "dist/ModernQGIS-ShellPreview-v$v-windows-x64"
          $docs = "$stage/docs"
          New-Item -ItemType Directory -Force -Path $stage, $docs | Out-Null
          Copy-Item "build/src/Release/modernqgis-sandbox.exe" $stage
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations "$stage/modernqgis-sandbox.exe"
          Copy-Item "LICENSE" $stage
          Copy-Item "README.md", "README.ja.md", "README.en.md" $docs
          Copy-Item "release/notes/v$v.zh-CN.md", "release/notes/v$v.ja-JP.md", "release/notes/v$v.en-US.md" $docs
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/ModernQGIS-ShellPreview-v$v-windows-x64.zip"
          $file = "dist/ModernQGIS-ShellPreview-v$v-windows-x64.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ModernQGIS-ShellPreview-v$v-windows-x64.zip" | Set-Content -NoNewline dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ModernQGIS-ShellPreview-v${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/ModernQGIS-ShellPreview-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish tagged GitHub Release only
        if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: release/notes/v${{ steps.version.outputs.version }}.en-US.md
          files: |
            dist/ModernQGIS-ShellPreview-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS
