name: Bug report
description: Report a reproducible ModernQGIS problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials, signing material, private project data, or unredacted local paths."
  - type: input
    id: version
    attributes: {label: ModernQGIS version/commit}
    validations: {required: true}
  - type: input
    id: qgis
    attributes: {label: QGIS version, description: "Use 'sandbox / not connected' when QGIS integration is disabled."}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
