name: Feature request
description: Propose a ModernQGIS shell or architecture improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or workflow}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: dropdown
    id: layer
    attributes:
      label: Likely layer
      options: [Shell/UI, Command registry, Pane system, Workspace, QGIS bridge/compatibility, Unsure]
  - type: textarea
    id: upstream
    attributes: {label: Upstream relevance, description: "Would this still improve QGIS if the ModernQGIS visual shell disappeared?"}
